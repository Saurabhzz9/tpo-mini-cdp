name: Verify application
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-isolated-test-password
          POSTGRES_DB: tpo_verify_c1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TPO_POSTGRES_TEST_URL: postgresql://postgres:ci-isolated-test-password@localhost:5432/tpo_verify_c1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Package Linux deployment
        run: |
          node scripts/check-release.mjs
          mkdir -p .next/standalone/scripts
          cp -R migrations .next/standalone/
          cp scripts/migrate-prod.mjs .next/standalone/scripts/
          cd .next/standalone
          zip -q -r ../../tpo-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deployment
          path: tpo-linux.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy-demo:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: azure-assessment-demo
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Respect the 14-day assessment expiry
        id: lifetime
        run: |
          if [[ "$(date -u +%Y%m%d)" < "20261029" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.lifetime.outputs.enabled == 'true'
        with:
          name: linux-deployment
      - uses: azure/login@v2
        if: steps.lifetime.outputs.enabled == 'true'
        with:
          client-id: 1913b7ea-ee45-4d08-a341-166c06efea3b
          tenant-id: c7b539b9-5e41-46ed-922b-b097a5bc6515
          subscription-id: e96c8788-8622-4dae-a0b4-ec85fe87fde6
      - name: Deploy the verified Linux standalone release
        if: steps.lifetime.outputs.enabled == 'true'
        run: |
          az webapp deploy --resource-group tpo-mini-cdp-demo-rg --name tpo-cdp-s9-261015 --src-path tpo-linux.zip --type zip --clean true --restart true --timeout 600000 --output none
