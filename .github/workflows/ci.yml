name: Verify application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-isolated-test-password
          POSTGRES_DB: tpo_verify_c1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TPO_POSTGRES_TEST_URL: postgresql://postgres:ci-isolated-test-password@localhost:5432/tpo_verify_c1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Package Linux deployment
        run: |
          node scripts/check-release.mjs
          mkdir -p .next/standalone/scripts
          cp -R migrations .next/standalone/
          cp scripts/migrate-prod.mjs .next/standalone/scripts/
          cd .next/standalone
          zip -q -r ../../tpo-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deployment
          path: tpo-linux.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
